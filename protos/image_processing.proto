syntax = "proto3";

package imageprocessing;

option go_package = "imageprocessing/";

import "google/api/annotations.proto";

service ImageProcessingService {
  rpc ProcessImage (ImageProcessingRequest) returns (ImageProcessingResponse) {
    option (google.api.http) = {
      post: "/v1/image/process"
      body: "*"
    };
  }
}

// Request message containing the image and desired operations.
message ImageProcessingRequest {
  bytes input_image = 1;               // Raw image file bytes
  string input_format = 2;             // e.g. "JPEG", "PNG" (optional, auto-detected if omitted)
  string output_format = 3;            // Desired output format (defaults to input format)
  repeated ImageOperation operations = 4;  // Ordered list of transformations to apply
}

// Wrapper for a single operation using oneof to support different parameter shapes.
message ImageOperation {
  oneof operation {
    FlipHorizontal   flip_horizontal   = 1;
    FlipVertical     flip_vertical     = 2;
    RotateDegrees    rotate_degrees    = 3;
    ConvertGrayscale convert_grayscale = 4;
    Resize           resize            = 5;
    Thumbnail        thumbnail         = 6;
    RotateLeft       rotate_left       = 7;
    RotateRight      rotate_right      = 8;
  }
}

// Flip the image along the horizontal axis (top-bottom mirror).
message FlipHorizontal {}

// Flip the image along the vertical axis (left-right mirror).
message FlipVertical {}

// Rotate the image by an arbitrary angle in degrees (counter-clockwise).
message RotateDegrees {
  double angle = 1;
}

// Convert the image to grayscale.
message ConvertGrayscale {}

// Resize the image to exact dimensions.
message Resize {
  int32 percent = 1;
}

// Generate a thumbnail that fits within the given bounds while preserving aspect ratio.
message Thumbnail {
  int32 max_width = 1;
  int32 max_height = 2;
}

// Rotate the image 90 degrees counter-clockwise.
message RotateLeft {}

// Rotate the image 90 degrees clockwise.
message RotateRight {}

// Response message containing the processed image and metadata.
message ImageProcessingResponse {
  bytes output_image = 1;              // Processed image file bytes
  string output_format = 2;           // Format of the output image
  int32 width = 3;                     // Width of the output image in pixels
  int32 height = 4;                    // Height of the output image in pixels
  bytes thumbnail_image = 5;
}
